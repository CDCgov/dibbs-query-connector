name: CI

on:
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24 # Adjust the Node.js version as needed

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run lint
        uses: ./.github/actions/lint

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Create .env
        env:
          AIDBOX_LICENSE: ${{ secrets.AIDBOX_LICENSE }}
          MTLS_CERT_B64: ${{ secrets.MTLS_CERT_B64 }}
          MTLS_KEY_B64: ${{ secrets.MTLS_KEY_B64 }}
        run: |
          {
            echo "AIDBOX_LICENSE=$AIDBOX_LICENSE"
            echo "MTLS_CERT=$MTLS_CERT_B64"
            echo "MTLS_KEY=$MTLS_KEY_B64"
            echo "NEXT_PUBLIC_AUTH_PROVIDER=keycloak"
            echo "RUN_FETCH_INTERCEPTOR=true"
            echo "IS_CI=true"
          } > .env.test
      - name: Verify Secret Presence
        env:
          KEY: ${{ secrets.AIDBOX_LICENSE }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::AIDBOX_LICENSE secret is empty or unset!"
            exit 1
          else
            echo "AIDBOX_LICENSE is present (${#KEY} characters long)"
          fi
      - name: Install dependencies
        run: |
          npm ci
      - name: Run tests
        id: run_unit_and_integration_tests
        run: |
          sudo mkdir keys
          sudo chmod -R 755 keys
          sudo chown -R $USER:$USER keys
          npm run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: CDCgov/dibbs-query-connector

  end-to-end-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create .env
        env:
          AIDBOX_LICENSE: ${{ secrets.AIDBOX_LICENSE }}
          MTLS_CERT_B64: ${{ secrets.MTLS_CERT_B64 }}
          MTLS_KEY_B64: ${{ secrets.MTLS_KEY_B64 }}
        run: |
          {
            echo "AIDBOX_LICENSE=$AIDBOX_LICENSE"
            echo "MTLS_CERT=$MTLS_CERT_B64"
            echo "MTLS_KEY=$MTLS_KEY_B64"
            echo "NEXT_PUBLIC_AUTH_PROVIDER=keycloak"
            echo "RUN_FETCH_INTERCEPTOR=true"
            echo "IS_CI=true"
          } > .env.test
      - name: Build Query Connector and Run Playwright Tests
        id: run_e2e_tests
        run: |
          npm run test:playwright
