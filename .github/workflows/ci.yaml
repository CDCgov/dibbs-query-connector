name: CI

on:
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24 # Adjust the Node.js version as needed

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run lint
        uses: ./.github/actions/lint

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    env:
      AIDBOX_LICENSE: ${{ secrets.AIDBOX_LICENSE }}
      MTLS_CERT: ${{ secrets.MTLS_CERT_B64 }}
      MTLS_KEY: ${{ secrets.MTLS_KEY_B64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          npm ci
      - name: Run tests
        id: run_unit_and_integration_tests
        run: |
          npm run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: CDCgov/dibbs-query-connector

  end-to-end-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      AIDBOX_LICENSE: ${{ secrets.AIDBOX_LICENSE }}
      MTLS_CERT: ${{ secrets.MTLS_CERT_B64 }}
      MTLS_KEY: ${{ secrets.MTLS_KEY_B64 }}
      RUN_FETCH_INTERCEPTOR: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Build Query Connector and Run Playwright Tests
        id: run_e2e_tests
        run: |
          npm run test:playwright
