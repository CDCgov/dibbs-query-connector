name: Release

# Runs after a successful `CD` run on `main`. If that push bumped the `version`
# field in `app_version.yml`, tags the commit as vX.Y.Z, publishes a GitHub
# Release with auto-generated notes, and posts the link to Slack.
#
# The images for the release (vX.Y.Z / vX.Y / vX / latest) were already built,
# pushed and deployed by `CD`, so a release is only ever published for an image
# that built and deployed successfully.

on:
  workflow_run:
    workflows: [CD]
    types: [completed]
    branches: [main]

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the commit CD deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect version bump
        id: detect
        run: python3 .github/scripts/detect_version_bump.py

      - name: Tag release commit (idempotent)
        if: steps.detect.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          # Resolve the existing tag (if any) to the COMMIT it points at so we
          # can compare against the deployed SHA. For an annotated tag the plain
          # ref resolves to the tag-object SHA, so dereference with ^{} to get
          # the commit; fall back to the plain ref for lightweight tags. An
          # empty result means the tag does not exist yet.
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${VERSION}^{}" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA=$(git ls-remote origin "refs/tags/${VERSION}" | awk '{print $1}')
          fi
          if [ -z "$REMOTE_SHA" ]; then
            echo "Creating tag ${VERSION} at ${RELEASE_SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}" "${RELEASE_SHA}"
            git push origin "${VERSION}"
          elif [ "$REMOTE_SHA" = "$RELEASE_SHA" ]; then
            echo "Tag ${VERSION} already exists at ${RELEASE_SHA}; continuing (re-run)."
          else
            echo "::error::Tag ${VERSION} already exists at ${REMOTE_SHA}, not ${RELEASE_SHA}. Refusing to overwrite."
            exit 1
          fi

      - name: Create or fetch GitHub Release
        if: steps.detect.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Try to create the release. If it already exists (e.g. on a re-run),
          # fall back to fetching the existing release's URL so the workflow
          # remains idempotent.
          response=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @- "https://api.github.com/repos/${REPO}/releases" <<EOF
          {
            "tag_name": "${VERSION}",
            "target_commitish": "${RELEASE_SHA}",
            "name": "${VERSION}",
            "generate_release_notes": true,
            "draft": false
          }
          EOF
          )
          html_url=$(echo "$response" | jq -r '.html_url // empty')
          if [ -z "$html_url" ] || [ "$html_url" = "null" ]; then
            echo "Release creation did not return an html_url; checking for existing release."
            existing=$(curl --silent --show-error --fail \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}")
            html_url=$(echo "$existing" | jq -r '.html_url')
          fi
          echo "Release URL: $html_url"
          echo "RELEASE_URL=$html_url" >> "$GITHUB_ENV"

      - name: Post release to Slack
        if: steps.detect.outputs.is_release == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":package: A new release has been created: <${{ env.RELEASE_URL }}|${{ steps.detect.outputs.version }}>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":package: A new release has been created: <${{ env.RELEASE_URL }}|${{ steps.detect.outputs.version }}>"
