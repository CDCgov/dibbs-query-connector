# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Shared DIBBs conventions: every ecosystem runs weekly on Monday at 12:00 UTC
# (07:00/08:00 US Eastern), minor and patch version updates are grouped into one
# PR per ecosystem, majors get their own PRs, and version updates wait out a
# 5-day cooldown. Security updates are not grouped or delayed.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "jose"
        update-types: ["version-update:semver-major"]
      # @trussworks/react-uswds requires peer focus-trap-react@^11; drop when it supports v12
      - dependency-name: "focus-trap-react"
        update-types: ["version-update:semver-major"]
      # keep @types/node on the major matching the node:24 Docker runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint pins typescript <6.1.0; drop when it supports TS 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-compose-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Terraform updates only scan the listed directories, not subdirectories,
  # so every directory to update is listed explicitly. The rest of
  # terraform/aws is left out on purpose: it is kept as a frozen reference that
  # nothing applies anymore (see terraform/aws/README.md). Only its live
  # redirect root is updated.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/aws/redirect"
      - "/terraform/azure"
      - "/terraform/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    # The limit applies per directory, so keep it low for long directory lists.
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      terraform-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      terraform-per-dependency:
        # Everything the group above doesn't take (majors, and constraint-only
        # updates Dependabot can't classify): one PR per dependency, covering
        # every directory that uses it.
        applies-to: version-updates
        patterns: ["*"]
        group-by: dependency-name
